# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CHANGED: Removed package manager detection — this project uses npm
      # (package-lock.json is committed). npm ci is faster and more reliable in CI.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # CHANGED: Removed `static_site_generator: next` — this project's
      # next.config.mjs handles basePath/assetPrefix via the BASE_PATH env var
      # passed to the build script. The auto-injection would conflict.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # REMOVED: .next/cache restore — not needed, the build script handles everything.

      - name: Install dependencies
        run: npm ci

      # CHANGED: Replaced `npx next build` with the project's static build script.
      # This runs scripts/build-static.mjs which:
      #   1. Generates src/lib/staticDemoData.ts from diagrams/
      #   2. Moves src/app/api/ out of the way (output:export can't have API routes)
      #   3. Runs next build with STATIC_EXPORT=1, NEXT_PUBLIC_STATIC_DEMO=1
      #   4. Restores API routes
      # The basePath is dynamic — uses the repo name from GitHub Actions context,
      # so it works regardless of what the repo is called.
      - name: Build static site
        run: node scripts/build-static.mjs /${{ github.event.repository.name }}

      # ADDED: GitHub Pages needs .nojekyll so that underscore-prefixed
      # directories (like _next/) are served instead of being ignored by Jekyll.
      # (The build script also creates this, but explicit is safer.)
      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
